[package]
name = "tyranny"
version = "0.1.0"
edition = "2024"
default-run = "audio-probe"

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "software-resampling"] }
rtrb = "0.4.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
sha2 = "0.10"
lofty = "0.25.4"
rusty-chromaprint = "0.3.0"

[dev-dependencies]
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AUComponent", "AudioComponent", "AudioOutputUnit", "AudioUnitProperties", "objc2-core-audio-types"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "HostTime", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[[bin]]
name = "audio-probe"
path = "src/bin/audio-probe.rs"
