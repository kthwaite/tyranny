<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="field" cx="512" cy="460" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2540"/>
      <stop offset="1" stop-color="#060912"/>
    </radialGradient>
    <radialGradient id="glow" cx="512" cy="512" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="372" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.45" stop-color="#f7a82a"/>
      <stop offset="1" stop-color="#c8241b"/>
    </linearGradient>
    <radialGradient id="label" cx="495" cy="490" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f86c0"/>
      <stop offset="1" stop-color="#14304f"/>
    </radialGradient>
    <linearGradient id="sheen" x1="350" y1="350" x2="674" y2="674" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flame" fill="url(#fire)"
          d="M 484 372 C 478 322 500 292 505 254 C 508 230 518 214 512 194 C 534 222 550 262 540 300 C 533 328 546 350 540 372 Z"/>
    <path id="star" fill="#f2cf74"
          d="M 0 -22 C 3 -5 5 -3 22 0 C 5 3 3 5 0 22 C -3 5 -5 3 -22 0 C -5 -3 -3 -5 0 -22 Z"/>
  </defs>

  <!-- macOS icon body: 824pt squircle on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#field)" filter="url(#shadow)"/>

  <!-- stars -->
  <use xlink:href="#star" transform="translate(200 205)"/>
  <use xlink:href="#star" transform="translate(830 230) scale(0.6)"/>
  <use xlink:href="#star" transform="translate(812 812) scale(0.8)"/>
  <use xlink:href="#star" transform="translate(214 800) scale(0.55)"/>

  <!-- seal rings -->
  <circle cx="512" cy="512" r="366" fill="none" stroke="#b3201c" stroke-width="16"/>
  <circle cx="512" cy="512" r="344" fill="none" stroke="#e8c26a" stroke-width="5"/>

  <!-- corona -->
  <circle cx="512" cy="512" r="320" fill="url(#glow)"/>
  <g id="corona">
    <use xlink:href="#flame" transform="rotate(0 512 512)"/>
    <use xlink:href="#flame" transform="rotate(22.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(45 512 512)"/>
    <use xlink:href="#flame" transform="rotate(67.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(90 512 512)"/>
    <use xlink:href="#flame" transform="rotate(112.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(135 512 512)"/>
    <use xlink:href="#flame" transform="rotate(157.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(180 512 512)"/>
    <use xlink:href="#flame" transform="rotate(202.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(225 512 512)"/>
    <use xlink:href="#flame" transform="rotate(247.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(270 512 512)"/>
    <use xlink:href="#flame" transform="rotate(292.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
    <use xlink:href="#flame" transform="rotate(315 512 512)"/>
    <use xlink:href="#flame" transform="rotate(337.5 512 512) translate(512 512) scale(0.82) translate(-512 -512)"/>
  </g>

  <!-- record -->
  <circle cx="512" cy="512" r="178" fill="#0b0d12" stroke="#f2cf74" stroke-width="4"/>
  <g fill="none" stroke="#262c38" stroke-width="2">
    <circle cx="512" cy="512" r="164"/>
    <circle cx="512" cy="512" r="150"/>
    <circle cx="512" cy="512" r="136"/>
    <circle cx="512" cy="512" r="122"/>
    <circle cx="512" cy="512" r="108"/>
    <circle cx="512" cy="512" r="94"/>
    <circle cx="512" cy="512" r="80"/>
  </g>
  <circle cx="512" cy="512" r="176" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="64" fill="url(#label)" stroke="#e8c26a" stroke-width="4"/>
  <circle cx="512" cy="512" r="9" fill="#0b0d12"/>
</svg>
